<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2R Troops Stacking Calculator</title>
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- Bootstrap Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/bootstrap.bundle.min.js" defer></script>
    <script src="assets/js/index.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <div class="d-flex align-items-center">
          <a class="navbar-brand fw-bold me-2" href="#">
            A2R Troops Stacking Calculator
          </a>
          <a
            href="#accordionExample"
            class="badge rounded-pill bg-secondary text-decoration-none"
            id="versionLink"
            style="cursor: pointer"
          >
            v0.2.1
          </a>
        </div>

        <div class="nav-item dropdown">
          <button
            class="btn btn-link nav-link dropdown-toggle d-flex align-items-center"
            id="bd-theme"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <!-- This icon will change dynamically based on the active theme -->
            <i class="bi bi-circle-half me-2 theme-icon-active"></i>
            <span class="d-none d-lg-inline">Theme</span>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end shadow"
            aria-labelledby="bd-theme"
          >
            <li>
              <button
                type="button"
                class="dropdown-item d-flex align-items-center active"
                data-bs-theme-value="light"
              >
                <i class="bi bi-sun-fill me-2 opacity-50"></i>
                Light
                <i class="bi bi-check2 ms-auto d-none"></i>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item d-flex align-items-center"
                data-bs-theme-value="dark"
              >
                <i class="bi bi-moon-stars-fill me-2 opacity-50"></i>
                Dark
                <i class="bi bi-check2 ms-auto d-none"></i>
              </button>
            </li>
            <li>
              <button
                type="button"
                class="dropdown-item d-flex align-items-center"
                data-bs-theme-value="auto"
              >
                <i class="bi bi-circle-half me-2 opacity-50"></i>
                Auto
                <i class="bi bi-check2 ms-auto d-none"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container">
      <div>
        <h1 class="text-center my-4">A2R Troops Stacking Calculator</h1>
      </div>

      <!-- Stats Input Row -->
      <div class="row mb-4">
        <!-- Leadership (Red) -->
        <div class="col-md-4 mb-3">
          <div class="form-floating">
            <input
              type="number"
              class="form-control border-danger"
              id="input-leadership"
              placeholder="0"
              min="0"
            />
            <label for="input-leadership" class="fw-bold text-danger">
              <i class="bi bi-shield-shaded me-1"></i> Leadership
            </label>
          </div>
        </div>

        <!-- Authority (Brown) -->
        <div class="col-md-4 mb-3">
          <div class="form-floating">
            <input
              type="number"
              class="form-control"
              id="input-authority"
              placeholder="0"
              min="0"
              style="border-color: #8b4513"
              disabled
            />
            <label for="input-authority" class="fw-bold" style="color: #8b4513">
              <i class="bi bi-person-badge-fill me-1"></i> Authority
            </label>
          </div>
        </div>

        <!-- Dominance (Yellow) -->
        <div class="col-md-4 mb-3">
          <div class="form-floating">
            <input
              type="number"
              class="form-control border-warning"
              id="input-dominance"
              placeholder="0"
              min="0"
              disabled
            />
            <label for="input-dominance" class="fw-bold text-warning">
              <i class="bi bi-lightning-fill me-1"></i> Dominance
            </label>
          </div>
        </div>
      </div>

      <!-- Container where rows will be injected -->
      <div id="guardsmen-root" class="mt-3"></div>

      <div class="accordion mb-4" id="accordionExample">
        <div class="accordion-item bg-transparent">
          <h2 class="accordion-header" id="headingOne">
            <button
              class="accordion-button collapsed bg-transparent text-secondary"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapseOne"
              aria-expanded="false"
              aria-controls="collapseOne"
            >
              <small
                ><i class="bi bi-clock-history me-2"></i> Version History &
                Changelog</small
              >
            </button>
          </h2>
          <div
            id="collapseOne"
            class="accordion-collapse collapse"
            aria-labelledby="headingOne"
            data-bs-parent="#accordionExample"
          >
            <div
              class="accordion-body"
              id="changelogContent"
              style="
                white-space: pre-wrap;
                font-family: monospace;
                font-size: 0.85rem;
              "
            >
              Loading changelog...
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- The Blueprint -->
    <template id="tier-row-template">
      <div class="card mb-2 border-danger shadow-sm tier-card">
        <div class="card-body p-2">
          <div class="d-flex flex-wrap align-items-center">
            <!-- Tier Label -->
            <div class="ps-2 me-3" style="min-width: 60px">
              <div class="form-check">
                <input
                  class="form-check-input tier-master-check"
                  type="checkbox"
                />
                <label class="form-check-label fw-bold tier-label-text"></label>
              </div>
            </div>

            <!-- Units Grid -->
            <div class="unit-slot-container flex-grow-1">
              <!-- JS will inject units here -->
            </div>
          </div>
        </div>
      </div>
    </template>

    <template id="unit-item-template">
      <div class="unit-item d-flex flex-column">
        <div class="input-group input-group-sm">
          <div class="input-group-text">
            <input class="form-check-input unit-check" type="checkbox" />
          </div>
          <span class="input-group-text flex-grow-1 unit-name-label"></span>
          <span
            class="form-control text-end fw-bold unit-count-output d-flex align-items-center justify-content-end"
            style="max-width: 75px; min-height: 31px"
            >0</span
          >
        </div>
        <div
          class="d-flex justify-content-between align-items-center px-1 mt-1"
        >
          <span class="dmg-label">TOTAL DMG</span>
          <span class="fw-bold unit-dmg-output">0</span>
        </div>
      </div>
    </template>
  </body>
</html>
